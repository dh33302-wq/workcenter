<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#F2F2F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>작업센터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>/* BUILD 4 — One UI 방식(우리 색·이니셜): 옅은 회색 바탕 + 흰 둥근 카드, 다크는 검정 바탕 + 짙은 회색 카드.
   큰 제목(위 1/3) → 스크롤하면 작은 제목이 위에 붙음. 전환은 0.2~0.3초, 전환당 애니 1개. */
:root{--bg:#F2F2F6;--card:#FFFFFF;--tx:#16161A;--mut:#6E6E78;--line:#E6E6EC;--chip:#EEF0F5;--ringbg:#E8E9EF;--sh:0 1px 2px rgba(0,0,0,.04);
  --acc:#3478F6;--r:#EF4438;--y:#F2A31B;--g:#22B05A;--b:#3478F6;--p:#8C6CF0;--me:#3478F6;--metx:#fff;--rad:26px;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#17171B;--tx:#F2F2F5;--mut:#9C9CA6;--line:#26262C;--chip:#24242A;--ringbg:#2A2A31;--sh:none;--me:#2C62C9;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Noto Sans KR",sans-serif}
button{font:inherit;color:inherit}
.sp{flex:1}.sub{color:var(--mut);font-size:12px;font-weight:normal}.cnt{color:var(--mut);font-weight:500;font-size:13px}
/* 위 작은 제목줄 */
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:transparent;transition:background .25s}
body.scrolled header{background:var(--bg)}
#mini-ttl{font-size:17px;opacity:0;transition:opacity .25s;white-space:nowrap}body.scrolled #mini-ttl{opacity:1}
#ver{color:var(--mut);font-size:11px}
#sync{font-size:11px;color:var(--mut)}#sync.ok{color:var(--g)}#sync.wait{color:var(--y)}#sync.err{color:var(--r)}
.ib{background:none;border:0;font-size:19px;padding:6px;cursor:pointer;border-radius:50%}
.askbtn{position:relative;white-space:nowrap;background:var(--card);border:0;border-radius:20px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--sh)}
.askbtn .badge{position:absolute;top:-5px;right:-5px}
.badge{background:var(--r);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;line-height:18px;font-weight:600;display:inline-block}
.badge:empty{display:none}
/* 틀: 좁으면 1열, 넓으면(폴드 펼침·PC) 왼쪽 목록 + 오른쪽 옆 창 */
#wrap{max-width:1280px;margin:0 auto}
main{padding:0 14px calc(env(safe-area-inset-bottom) + 92px);min-width:0}
#side{display:none}
@media(min-width:700px){
  #wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,44%);gap:18px;padding:0 18px}
  main{padding:0 0 110px}
  #side{display:block;position:sticky;top:calc(env(safe-area-inset-top) + 58px);align-self:start;max-height:calc(100vh - 150px);overflow:auto;margin-top:calc(env(safe-area-inset-top) + 58px);
    background:var(--card);border-radius:var(--rad);padding:18px;box-shadow:var(--sh)}
}
@media(min-width:1100px){#wrap{grid-template-columns:minmax(0,1fr) 460px}}
.pane{display:none}
.pane.on{display:block;animation:pin .22s ease-out}
@keyframes pin{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.pane.on,.sheet{animation:none!important}}
/* 큰 제목 영역(보기 영역) */
.hero{min-height:30vh;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(env(safe-area-inset-top) + 60px) 8px 18px}
.hero h1{margin:0 0 12px;font-size:30px;font-weight:700;letter-spacing:-.5px}
@media(min-width:700px){.hero{min-height:24vh}}
.hsum{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;min-height:40px}
.hsum .hn{flex:1 1 0;min-width:0}.hn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hn{display:flex;flex-direction:column;align-items:flex-start;min-width:52px}
.hn b{font-size:26px;font-weight:700;line-height:1.1}.hn span{font-size:12px;color:var(--mut)}
.hn.r b{color:var(--r)}.hn.g b{color:var(--g)}.hn.b b{color:var(--b)}.hn.y b{color:var(--y)}
.bigring{width:78px;height:78px;flex:none}@media(min-width:700px){.bigring{width:96px;height:96px}.hsum .hn{flex:0 0 auto;min-width:64px}}
.sec{font-size:14px;color:var(--mut);margin:20px 8px 8px;font-weight:600;display:flex;align-items:center;gap:6px}
/* 카드·타일 */
.card{background:var(--card);border-radius:var(--rad);padding:16px;box-shadow:var(--sh);min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:var(--card);border:0;border-radius:var(--rad);padding:16px;min-height:112px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;cursor:pointer;box-shadow:var(--sh);min-width:0;position:relative}
.tile .big{font-size:24px;font-weight:700;line-height:1.1;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .lb{font-size:13px;color:var(--mut);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.sel,.li.sel,.gt.sel{outline:2px solid var(--acc);outline-offset:-2px}
.ic{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:19px;background:var(--chip)}
.ic.r{background:color-mix(in srgb,var(--r) 16%,transparent)}.ic.g{background:color-mix(in srgb,var(--g) 16%,transparent)}
.ic.b{background:color-mix(in srgb,var(--b) 16%,transparent)}.ic.y{background:color-mix(in srgb,var(--y) 18%,transparent)}
.ic.p{background:color-mix(in srgb,var(--p) 16%,transparent)}.ic.n{background:var(--chip)}
/* 목록(동그라미 아이콘 + 제목 + 오른쪽 값, 얇은 줄) */
.group{background:var(--card);border-radius:var(--rad);overflow:hidden;box-shadow:var(--sh)}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:62px;cursor:pointer;position:relative;width:100%;background:none;border:0;text-align:left}
.li+.li,.li+.det,.det+.li{box-shadow:inset 0 1px 0 var(--line)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t s{display:block;text-decoration:none;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{flex:none;color:var(--mut);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.li.read{opacity:.55}.li.urg .t b{color:var(--r)}
.li .mini{width:34px;height:34px}
.empty{color:var(--mut);font-size:14px;padding:16px;text-align:center}
.chk{flex:none;background:var(--chip);border:0;border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--acc)}
.pend{color:var(--y);font-size:12px}.fail{color:var(--r);font-size:12px}
.more{display:block;width:100%;margin-top:10px;background:var(--card);border:0;color:var(--acc);border-radius:20px;padding:12px;cursor:pointer;font-weight:600;box-shadow:var(--sh)}
/* 막대 */
.bar1{height:6px;background:var(--ringbg);border-radius:3px;overflow:hidden;margin:6px 0}.bar1>b{display:block;height:100%;background:var(--b);border-radius:3px;transition:width .3s}
.bar1.g>b{background:var(--g)}.bar1.r>b{background:var(--r)}.bar1.y>b{background:var(--y)}
.bar1.ind>b{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--b) 50%,transparent) 0 8px,transparent 8px 16px)}
/* 게임 타일(사진 + 색 배지 + 링) */
.gtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:1100px){.gtiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gt{background:var(--card);border:0;border-radius:var(--rad);padding:0;overflow:hidden;cursor:pointer;text-align:left;box-shadow:var(--sh);min-width:0;position:relative}
.gt .ph{aspect-ratio:16/9;background:var(--gc);position:relative;display:block;background-size:cover;background-position:center}
.gt .ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.45))}
.gt .bd{position:absolute;left:10px;top:10px;z-index:1;background:var(--gc);color:#fff;font-weight:700;font-size:12.5px;border-radius:12px;padding:3px 9px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.gt .live{position:absolute;right:10px;top:10px;z-index:1;font-size:13px;background:rgba(0,0,0,.45);color:#fff;border-radius:12px;padding:2px 8px}
.gt .ft{display:flex;align-items:center;gap:8px;padding:10px 12px}
.gt .ft .t{flex:1;min-width:0}.gt .ft b{display:block;font-size:20px;font-weight:700;line-height:1.1}
.gt .ft s{display:block;text-decoration:none;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt .mini{width:38px;height:38px;flex:none}
.gt.진행{box-shadow:0 0 0 2px var(--gc),var(--sh)}
/* 펼침/옆 창 자세히 */
.det{padding:6px 16px 16px;grid-column:1/-1;animation:pin .22s ease-out;background:var(--card);border-radius:0}
.gtiles>.det,.tiles>.det{border-radius:var(--rad);box-shadow:var(--sh);padding:16px}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:10px}.dh h3{margin:0;font-size:18px;flex:1;min-width:0;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:8px 0}
.kv>div{background:var(--chip);border-radius:16px;padding:10px;text-align:center}.kv b{display:block;font-size:20px}.kv span{font-size:12px;color:var(--mut)}
.dl{font-size:14px;margin:8px 0;word-break:keep-all;overflow-wrap:anywhere}
.log{font:12px/1.45 ui-monospace,Consolas,monospace;background:var(--chip);border-radius:14px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}
.files{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.files span{background:var(--chip);border-radius:12px;padding:3px 9px;font-size:12px;color:var(--mut)}
.jsg{padding:10px 0;box-shadow:inset 0 1px 0 var(--line)}.jl{display:flex;gap:8px;align-items:center;font-size:14px}
.res{margin-top:6px;font-size:13px;background:color-mix(in srgb,var(--g) 12%,transparent);border-radius:12px;padding:8px 10px;overflow-wrap:anywhere}
.blk{font-size:13px;padding:8px 0;box-shadow:inset 0 1px 0 var(--line);overflow-wrap:anywhere}.blk .src{color:var(--mut);font-size:12px}
.side-empty{color:var(--mut);text-align:center;padding:40px 10px;font-size:15px}
/* 일정 */
.seg{display:inline-flex;background:var(--card);border-radius:20px;padding:3px;margin:0 0 12px 4px;box-shadow:var(--sh)}
.seg button{background:none;border:0;color:var(--mut);padding:6px 16px;font-size:14px;cursor:pointer;border-radius:17px;font-weight:600}.seg button.on{background:var(--acc);color:#fff}
#plan-head{margin:0 8px 8px;font-size:13px;color:var(--mut)}
.slot{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 14px;min-height:54px}
.slot+.slot{box-shadow:inset 0 1px 0 var(--line)}
.slot .hh{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--chip);color:var(--mut)}
.slot.now .hh{background:var(--acc);color:#fff}.slot.now{background:color-mix(in srgb,var(--acc) 6%,transparent)}
.slot .pl{flex:1;min-width:0;background:none;border:0;text-align:left;padding:6px 2px;font-size:15px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .pl:empty::before{content:'＋';color:var(--mut)}
.oxs{display:flex;gap:4px;flex:none}
.ox{width:34px;height:34px;border-radius:50%;border:0;background:var(--chip);color:var(--mut);font-size:14px;font-weight:700;cursor:pointer;padding:0}
.ox.on.O{background:var(--g);color:#fff}.ox.on.△{background:var(--y);color:#fff}.ox.on.X{background:var(--r);color:#fff}
.pd{color:var(--y);font-size:11px}
.wk{display:grid;grid-template-columns:2.2em repeat(7,minmax(0,1fr));gap:3px;font-size:11px;padding:12px}
.wk .c{height:18px;border-radius:5px;background:var(--chip)}.wk .c.p{background:color-mix(in srgb,var(--acc) 22%,transparent)}.wk .c.O{background:var(--g)}.wk .c.△{background:var(--y)}.wk .c.X{background:var(--r)}
.wk .hd{text-align:center;color:var(--mut);padding:3px 0;cursor:pointer;border-radius:8px}.wk .hd.today{color:#fff;background:var(--acc)}
.wk .hl{color:var(--mut);text-align:right;padding-right:3px;line-height:18px}
/* 퀴즈: 움직이는 클립 */
.qv{display:grid;grid-auto-flow:column;grid-auto-columns:78%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
.qv::-webkit-scrollbar{display:none}
@media(min-width:700px){.qv{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));grid-auto-columns:auto;overflow:visible}}
.qc{scroll-snap-align:center;background:var(--chip);border-radius:20px;overflow:hidden;position:relative;border:3px solid transparent;transition:border-color .2s}
.qc.on{border-color:var(--acc)}
.qc video,.qc img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
.qc .ql{position:absolute;left:8px;top:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-weight:700;display:grid;place-items:center}
.qc .qp{position:absolute;right:8px;top:8px;font-size:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:10px;padding:2px 7px}
.qc .qg{display:block;font-size:12px;color:var(--mut);padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qq{font-size:16px;font-weight:600;margin:0 2px 10px}
.opts{display:flex;gap:8px;margin-top:12px}
.opt{flex:1;background:var(--chip);border:0;border-radius:18px;padding:10px;font-weight:700;font-size:16px;cursor:pointer}
.opt.on{background:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--chip);border:0;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff}
.send{margin-top:12px;width:100%;background:var(--acc);border:0;color:#fff;border-radius:22px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
.send:disabled{opacity:.35}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.ring{text-align:center;font-size:12px;min-width:0}.ring svg{width:64px;height:64px}.ring .st{color:var(--mut)}
.ring .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oxv{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--chip)}.oxv.O{color:var(--g)}.oxv.X{color:var(--r)}.oxv.n{color:var(--mut)}
/* 아래 탭바: 아이콘 + 짧은 글, 고른 탭만 강조 */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
#tabs button{flex:1;max-width:120px;background:none;border:0;color:var(--mut);font-size:11.5px;padding:2px 0;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button i{font-style:normal;font-size:19px;line-height:30px;width:56px;border-radius:15px;filter:grayscale(1);opacity:.6;transition:background .2s}
#tabs button.on{color:var(--tx);font-weight:700}#tabs button.on i{filter:none;opacity:1;background:var(--chip)}
#tabs .badge{position:absolute;top:0;left:calc(50% + 8px)}
/* 시트(묻기·계획 고치기) */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:pin .22s ease-out}
.sheet[hidden]{display:none}
@media(min-width:700px){#ask{left:auto;width:min(480px,50vw);box-shadow:-10px 0 40px rgba(0,0,0,.18);border-radius:var(--rad) 0 0 var(--rad)}}
.sheet.mini{inset:auto 0 0 0;background:var(--card);border-radius:var(--rad) var(--rad) 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);gap:10px;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
@media(min-width:700px){.sheet.mini{left:50%;right:auto;width:440px;transform:translateX(-50%);bottom:90px;border-radius:var(--rad)}}
.ask-top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;font-size:18px}
.sheet.mini .ask-top{padding:0}
#ask-to{padding:4px 14px 0;flex-wrap:nowrap;overflow-x:auto;margin:0;scrollbar-width:none}#ask-to .chip{white-space:nowrap;padding:8px 14px}
.ths{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.ths button{flex:none;max-width:11em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--card);border:0;color:var(--mut);border-radius:14px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.ths button.on{background:var(--acc);color:#fff}.ths .nb{color:var(--r)}
#ask-msgs{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:86%;padding:10px 13px;border-radius:20px;font-size:14.5px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--me);color:var(--metx);border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px;box-shadow:var(--sh)}
.bub.wait{color:var(--y)}.bub.bad{color:var(--r)}
.bub .meta{display:block;opacity:.7;font-size:11px;margin-top:4px;white-space:normal}
.ask-in{display:flex;gap:8px;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px)}
.ask-in textarea{flex:1;min-width:0;resize:none;background:var(--card);border:0;border-radius:22px;color:var(--tx);font:inherit;padding:11px 15px;max-height:30vh;box-shadow:var(--sh)}
.ask-in button{flex:none;background:var(--acc);border:0;color:#fff;border-radius:22px;padding:0 18px;font-size:15px;font-weight:600;cursor:pointer}
#edit-val{background:var(--chip);border:0;border-radius:16px;color:var(--tx);font:inherit;padding:12px 14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:14px;z-index:30}
</style>
</head>
<body>
<!-- BUILD 4: One UI 방식(큰 제목 위 1/3 · 누르는 것은 아래 · 둥근 큰 카드), 한눈에 타일 → 누르면 펼침(좁은 화면)/옆 창(넓은 화면) -->
<header id="top">
  <b id="mini-ttl"></b><span id="ver"></span>
  <span class="sp"></span>
  <span id="sync" title="동기화">●</span>
  <button id="speak" class="ib" aria-label="읽어 주기">🔊</button>
  <button id="ask-open" class="askbtn" aria-label="선생님에게 묻기">🎓 묻기<span id="ask-badge" class="badge"></span></button>
</header>
<div id="wrap">
<main id="main">
  <section id="p-home" class="pane on">
    <div class="hero"><h1>🧭 작업센터</h1><div class="hsum" id="home-sum"></div></div>
    <div id="home-today"></div>
    <div class="tiles" id="home-tiles"></div>
    <div class="sec">🙋 나 <span id="home-mine-n" class="cnt"></span></div>
    <div class="group" id="home-tasks"></div>
  </section>
  <section id="p-pipe" class="pane">

<script>'use strict';
const BUILD=5;
// 브리지(Apps Script 웹앱, "나만" 접근) 주소. 비어 있으면 개발 모드: 같은 출처의 dev/ 경로를 쓴다(가짜 중계).
const BRIDGE_URL="https://script.google.com/macros/s/AKfycbyQXnNu8z7AMo523nYccMWzUhGgwb9yem-sOOXm6wZBbRuq5S8NuW2oFgoB8KAej4kF_w/exec";
// v1 5개 + v2 5개(SPEC_v2 3절) + jobs(6절: 여러 작업 진행도) + ext_games(BUILD 4: 게임별 뽑기 카드). 퀴즈 클립(clip_N)은 볼 때만 따로 받음
const STATE_NAMES=['meta','board','notices','progress','quiz_today','pipeline','tasks','plan_today','plan_week','answers','jobs','ext_games'];
const SYNC_MS=60000, SYNC_FAST_MS=8000, BUILD_CHECK_MS=300000, NOTICE_SHOW=4;
const TABS=['home','pipe','plan','work','noti'];
const ASK_TO=[['anim_teacher','🎓','선생님'],['ref_factory','🏭','공장'],['job_prep','💼','취준실'],['control','🛰️','팀장'],['code','🤖','일꾼']];  // 용어집 v1 말
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200)}

// 데이터층: 브리지(postMessage) 또는 개발용 HTTP. 화면은 api.get / api.post만 쓴다.
const api=(()=>{
  // 브리지(Apps Script, 나만 접근)가 토큰·폴더 ID를 건네주면, 드라이브 REST로 직접 읽고 쓴다(이글 앱 방식).
  let boot=lsGet('wc_boot',null),pending=null;
  const DRV='https://www.googleapis.com/drive/v3/files';
  function getBoot(force){
    if(!force&&boot&&Date.now()-boot.time<45*60000)return Promise.resolve(boot);
    if(pending)return pending;
    pending=new Promise((res,rej)=>{
      const fr=document.createElement('iframe');fr.style.display='none';
      fr.src=BRIDGE_URL+(BRIDGE_URL.includes('?')?'&':'?')+'bridge=1';
      const done=(fn,v)=>{clearTimeout(to);window.removeEventListener('message',on);fr.remove();pending=null;fn(v)};
      const to=setTimeout(()=>done(rej,new Error('브리지 응답 없음(구글 로그인 확인)')),20000);
      function on(ev){
        let h='';try{h=new URL(ev.origin).hostname}catch(e){}
        if(!/\.googleusercontent\.com$/.test(h))return; // 출처 검사
        const m=ev.data||{};if(!m.wcBridge)return;
        if(m.error)return done(rej,new Error(m.error));
        boot=m.boot;lsSet('wc_boot',boot);done(res,boot);
      }
      window.addEventListener('message',on);document.body.appendChild(fr);
    });
    return pending;
  }
  async function drive(url,opt,retry){
    const b=await getBoot(retry);
    const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+b.token},(opt||{}).headers||{})}));
    if((r.status===401||r.status===403)&&!retry)return drive(url,opt,true); // 토큰 만료·권한 → 다시 받기
    return r;
  }
  const dev=()=>!BRIDGE_URL||BRIDGE_URL.startsWith('/*');
  return {
    async get(names){
      if(dev()){const out={};for(const n of names){const r=await fetch('dev/state/'+n+'.json?v='+Date.now(),{cache:'no-store'});if(r.ok)out[n]=await r.json()}return {ok:true,state:out}}
      let b=await getBoot();
      // 새 파일이 생겼을 수 있음 — 다시 받기는 5분에 한 번만(없는 파일 때문에 매번 브리지를 부르지 않게)
      if(names.some(n=>!b.files[n])&&Date.now()-(api._fb||0)>300000){api._fb=Date.now();b=await getBoot(true)}
      const out={};
      await Promise.all(names.map(async n=>{const id=b.files[n];if(!id)return;
        const r=await drive(DRV+'/'+id+'?alt=media&v='+Date.now(),{cache:'no-store'});if(r.ok)out[n]=await r.json()}));
      return {ok:true,state:out};
    },
    async post(req){
      if(dev()){const r=await fetch('dev/inbox',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req)});return r.ok?{ok:true}:{ok:false,msg:'HTTP '+r.status}}
      const b=await getBoot();
      const meta={name:req.id+'.json',parents:[b.inbox],mimeType:'application/json'};
      const bd='wc'+Date.now();
      const body=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(req)}\r\n--${bd}--`;
      const r=await drive('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body});
      return r.ok?{ok:true}:{ok:false,msg:'드라이브 쓰기 '+r.status+(r.status===403?' (쓰기 권한 없음)':'')};
    }
  };
})();

// 보낼 요청 큐: 오프라인이어도 입력은 저장 → 연결되면 보냄. 상태: pend(보내는 중)/sent(보냄, 처리 대기)/ok/fail
const Q={
  list:()=>lsGet('wc_q',[]),
  save:l=>lsSet('wc_q',l.slice(-200)),
  add(kind,data){const l=Q.list();const req={id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:Math.floor(Date.now()/1000),kind,data,st:'pend'};l.push(req);Q.save(l);return req},
  // 보내는 동안(await) 새로 들어온 입력을 덮어쓰지 않게: 하나 보낼 때마다 최신 목록을 다시 읽어 그 항목만 고친다.
  // 보내기 실패(fail)는 다음 동기화 때 자동으로 다시 보냄. PC가 거절한 것(rej)은 자동으로 다시 보내지 않음.
  async flush(){
    const ids=Q.list().filter(r=>r.st==='pend'||(r.st==='fail'&&!r.rej)).map(r=>r.id);
    for(const id of ids){
      const r=Q.list().find(x=>x.id===id);if(!r)continue;
      let st,msg='';
      try{const res=await api.post({id:r.id,t:r.t,kind:r.kind,data:r.data});st=res.ok?'sent':'fail';msg=res.msg||''}catch(e){st='fail';msg=e.message}
      const l=Q.list();const x=l.find(y=>y.id===id);
      if(x&&(x.st==='pend'||x.st==='fail')){x.st=st;x.msg=msg;Q.save(l)}
    }
    return Q.list();
  },
  applyDone(done){ // meta.done = {id:{ok,msg}} — 에이전트가 처리한 결과
    if(!done)return;const l=Q.list();let ch=false;
    for(const r of l){const d=done[r.id];if(d&&r.st!=='ok'&&r.st!=='x'&&!(r.rej&&r.st==='fail')){r.st=d.ok?'ok':'fail';r.rej=!d.ok;r.msg=d.msg||'';ch=true}}
    // 끝난 요청은 하루 뒤 정리. 묻기(ask)는 답이 answers에 들어가므로 7일 보관
    if(ch)Q.save(l.filter(r=>!(r.st==='ok'&&Date.now()/1000-r.t>(r.kind==='ask'?7*86400:86400))));
  },
  stateOf(kind,key){const r=Q.list().filter(x=>x.kind===kind&&x.data&&x.data.key===key).pop();return r?r.st:null},
  of(kind){return Q.list().filter(x=>x.kind===kind)}
};

// 화면 (BUILD 4): 한눈에 타일·목록 → 누르면 그 자리 펼침(좁은 화면) / 오른쪽 옆 창(폭 700 이상: 폴드 펼침·PC).
// 글 최소: 아이콘·색·숫자·링·사진. 설명 문장은 펼쳤을 때만. 구역마다 HTML이 같으면 손대지 않는다(바뀐 구역만 교체).
const UI=(()=>{
  const last={};let showAll=false,quizSel=null,quizReasons=new Set(),quizKey=null,jobOld=false;
  let tab=TABS.includes(lsGet('wc_tab','home'))?lsGet('wc_tab','home'):'home',planView='day',planDate=null,editing=null;
  const sel=lsGet('wc_sel',{});const eff={};   // 탭마다 고른 것 'kind:id' / 옆 창 기본값
  const wide=()=>innerWidth>=700;
  function put(id,html){if(last[id]===html)return false;last[id]=html;const el=$(id);if(el)el.innerHTML=html;return true}
  const LIGHT={'🔴':'r','🟡':'y','🟢':'g'};
  const ST={'진행':['🔄','b'],'대기':['⏳','n'],'완료':['✅','g'],'막힘':['🔴','r'],'멈춤':['⏸️','y']};
  const COL={b:'var(--b)',g:'var(--g)',r:'var(--r)',y:'var(--y)',n:'var(--mut)',p:'var(--p)'};
  const fmtMin=m=>{m=Math.round(+m||0);if(m<60)return m+'분';const h=Math.floor(m/60),r=m%60;return h+'시간'+(r?' '+r+'분':'')};
  const hh=h=>String(h).padStart(2,'0');
  const ago=t=>{if(!t)return '—';const m=Math.max(0,Math.round((Date.now()/1000-t)/60));return m<1?'방금':m<60?m+'분 전':m<1440?Math.floor(m/60)+'시간 전':Math.floor(m/1440)+'일 전'};
  const hn=(v,l,c)=>`<div class="hn ${c||''}"><b>${v}</b><span>${l}</span></div>`;
  function ring(p,color,txt,cls){const r=26,c=2*Math.PI*r,v=p==null?0:Math.max(0,Math.min(1,p));txt=String(txt??'');
    return `<svg class="${cls||''}" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" style="stroke:var(--ringbg)" stroke-width="7"/>${p==null?'':`<circle cx="32" cy="32" r="${r}" fill="none" style="stroke:${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-v)).toFixed(1)}" transform="rotate(-90 32 32)"/>`}<text x="32" y="${txt.length>4?36:38}" text-anchor="middle" font-size="${txt.length>4?11:txt.length>3?13:16}" font-weight="700" style="fill:var(--tx)">${esc(txt)}</text></svg>`}
  const bar=(p,c)=>`<div class="bar1 ${c||''}${p==null?' ind':''}"><b style="width:${p==null?100:Math.round(p)}%"></b></div>`;
  const stOf=s=>ST[s]||['🔄','b'];

  // ---------- 탭 ----------
  function go(t,quiet){
    if(!TABS.includes(t))return;
    if(t!==tab||quiet){tab=t;lsSet('wc_tab',t)}
    for(const x of TABS){$('#p-'+x).classList.toggle('on',x===t);document.querySelector(`#tabs [data-tab="${x}"]`).classList.toggle('on',x===t)}
    $('#mini-ttl').textContent=$('#p-'+t+' h1').textContent;
    if(!quiet)window.scrollTo(0,0);
    side(Sync.state);if(t==='work')Clip.need(Sync.state);
  }
  function pick(key){ // 좁은 화면: 같은 것 다시 누르면 접기 / 넓은 화면: 옆 창에 표시
    sel[tab]=(!wide()&&sel[tab]===key)?'':key;lsSet('wc_sel',sel);all(Sync.state);
  }
  const isSel=key=>sel[tab]===key||(wide()&&!sel[tab]&&eff[tab]===key);
  const inl=(t,key,st)=>(!wide()&&sel[t]===key)?`<div class="det">${detail(key,st)}</div>`:'';

  // ---------- 자세히(펼침·옆 창 공용) ----------
  function detail(key,st){
    const i=key.indexOf(':'),k=key.slice(0,i),id=key.slice(i+1);
    if(k==='job')return jobDet(st,id);
    if(k==='game')return gameDet(st,id);
    if(k==='noti'){const n=((st.notices&&st.notices.items)||[]).find(x=>x.id===id);if(!n)return '';
      return `<div class="dh"><span class="ic ${n.urgent?'r':'b'}">${n.urgent?'🔴':'📬'}</span><h3>${esc(n.source)}</h3></div><div class="dl">${esc(n.text)}</div><div class="sub">⏱️ ${esc((n.date||'').slice(5))} ${esc(n.time||'')}</div>`}
    if(k==='proj'){const p=((st.board&&st.board.projects)||[])[+id];if(!p)return '';
      return `<div class="dh"><span class="ic ${LIGHT[p.light]||'n'}">${esc(p.light||'●')}</span><h3>${esc(p.name)}</h3></div><div class="dl">🔄 ${esc(p.now||'—')}</div>${p.blocked&&!/^없음/.test(p.blocked)?`<div class="dl">🔴 ${esc(p.blocked)}</div>`:''}<div class="sub">📨 요청 ${p.inbox_req||0}</div>`}
    if(k==='teach')return teachDet(st);
    if(k==='fb')return fbDet(st);
    if(k==='auto')return autoDet(st);
    if(k==='home')return homeDet(st);
    if(k==='today')return todayDet(st);
    return '';
  }
  function side(st){
    if(!wide())return;
    let h;
    if(tab==='plan')h=`<div class="dh"><span class="ic b">🗓️</span><h3>주간</h3></div>`+weekHtml(st);
    else{const key=sel[tab]||eff[tab];h=key?detail(key,st):''}
    put('#side-body',h||'<div class="side-empty">👈 눌러서 자세히</div>');
  }

  // ---------- 알림 ----------
  function notices(st){
    const items=(st.notices&&st.notices.items)||[];
    const readLocal=new Set(Q.list().filter(r=>r.kind==='notice_read').map(r=>r.data.key));
    const rows=items.map(n=>({...n,isRead:n.read||readLocal.has(n.id)}))
      .sort((a,b)=>(a.isRead-b.isRead)||(b.urgent-a.urgent)||String(b.date+b.time).localeCompare(a.date+a.time));
    const unread=rows.filter(r=>!r.isRead).length,urgent=rows.filter(r=>!r.isRead&&r.urgent).length;
    $('#n-unread').textContent=unread||'';
    const shown=showAll?rows:rows.slice(0,Math.max(6,unread));
    eff.noti=shown.length?'noti:'+shown[0].id:'';
    put('#notices',shown.length?shown.map(n=>{
      const qs=Q.stateOf('notice_read',n.id),key='noti:'+n.id;
      const tag=qs==='pend'||qs==='sent'?'<span class="pend">⏳</span>':qs==='fail'?'<span class="fail">⚠️</span>':'';
      return `<div class="li${n.isRead?' read':''}${n.urgent?' urg':''}${isSel(key)?' sel':''}" data-sel="${esc(key)}" data-id="${esc(n.id)}"><span class="ic ${n.urgent?'r':n.isRead?'n':'b'}">${n.urgent?'🔴':n.isRead?'📭':'📬'}</span>
      <span class="t"><b>${esc(n.text)}</b><s>${esc(n.source)} · ${esc((n.date||'').slice(5))} ${esc(n.time||'')}</s></span>
      ${n.isRead?tag:`<button class="chk" data-read="${esc(n.id)}">읽음</button>`}</div>${inl('noti',key,st)}`}).join(''):'<div class="empty">📭 새 알림 없음</div>');
    const more=$('#n-more');more.hidden=rows.length<=shown.length&&!showAll;more.textContent=showAll?'접기':`더 보기 ${rows.length-shown.length}`;
    return {unread,urgent,top:rows.filter(r=>!r.isRead).slice(0,2)};
  }

  // ---------- 팀·모션 진도 ----------
  function board(st){
    const ps=(st.board&&st.board.projects)||[];
    put('#board',ps.length?ps.map((p,i)=>{const key='proj:'+i,m=String(p.name).match(/^(\S+)\s+(.+)$/),blk=p.blocked&&!/^없음/.test(p.blocked);
      return `<div class="li${isSel(key)&&tab==='work'?' sel':''}" data-sel="${key}"><span class="ic ${LIGHT[p.light]||'n'}">${esc(m?m[1]:'●')}</span><span class="t"><b>${esc(m?m[2]:p.name)}</b><s>${blk?'🔴 ':''}${esc(blk?p.blocked:p.now)}</s></span><span class="v">${p.inbox_req?'📨 '+p.inbox_req:''}</span></div>${inl('work',key,st)}`}).join(''):'<div class="empty">현황 없음</div>');
  }
  const STAGE={'기획':.1,'블로킹':.35,'스플라인':.55,'폴리싱':.75,'디테일':.9,'완료':1};
  function progress(st){
    const ms=((st.progress&&st.progress.items)||[]).filter(m=>m.char!=='pipeline');
    put('#prog',ms.length?'<div class="rings">'+ms.map(m=>{
      const p=m.pct!=null?m.pct:(STAGE[m.stage]??0),late=m.target&&m.days>m.target;
      return `<div class="ring">${ring(p,late?'var(--r)':'var(--b)',Math.round(p*100))}<div class="lb">${esc(m.motion)}</div><div class="st">${esc(m.stage)}${m.days!=null?' · '+m.days+'일':''}${late?' ⚠️':''}</div></div>`}).join('')+'</div>':'<div class="empty">🎬 진행 중인 모션 없음</div>');
    return ms.length;
  }

  // ---------- 퀴즈: 움직이는 클립(소리 없음·자동 반복·탭=멈춤·좌우로 넘겨 비교) ----------
  function quiz(st){
    const q=st.quiz_today;

  // ---------- 진행도: 작업(hub\jobs) + 게임별 뽑기 카드 ----------
  const JORD={'막힘':0,'진행':1,'대기':2,'멈춤':3,'완료':4};
  const nowS=()=>Date.now()/1000;
  const isOld=j=>j.status==='완료'&&nowS()-j.t>86400, isStale=j=>j.status==='진행'&&nowS()-j.t>1800;
  const stagesHtml=P=>P.stages.map(s=>`<div class="jsg ${esc(s.status)}"><div class="jl"><span>${stOf(s.status)[0]}</span><b>${esc(s.n)}. ${esc(s.name)}</b><span class="sp"></span><span class="sub">${Math.round(s.pct)}%${s.status!=='완료'&&s.eta_min!=null?' · ⏱️ '+fmtMin(s.eta_min):''}</span></div>

  function jobList(st){const J=((st.jobs&&st.jobs.jobs)||[]).slice().sort((a,b)=>((JORD[a.status]??1)-(JORD[b.status]??1))||(b.t-a.t));return J}

  }
  function gameDet(st,key){

      ${(g.log||[]).length?`<div class="log">${esc(g.log.join('\n'))}</div>`:''}
      ${st.ext_games.stop?'<div class="sub">⏸️ 감시기 멈춤 표시(STOP) 있음</div>':''}`;

  function jobs(st){
    const J=jobList(st),live=J.filter(j=>!isOld(j)),olds=J.filter(isOld);
    const cnt={};for(const j of live)cnt[j.status]=(cnt[j.status]||0)+1;

    put('#jobs-sum',`${ring(avg,'var(--b)',run.length+'개','bigring')}${hn(cnt['진행']||0,'🔄 진행','b')}${hn(cnt['막힘']||0,'🔴 막힘','r')}${hn(cnt['대기']||0,'⏳ 대기')}${hn(cnt['완료']||0,'✅ 끝','g')}`);

    const row=j=>{const [e,c]=stOf(j.status),stale=isStale(j),p=j.pct==null?null:Math.round(j.pct),key='job:'+j.id;

    // 게임별 뽑기 카드: 새 게임·재추출은 PC 지킴이가 상태 파일을 읽어 저절로 카드가 생김

      return `<button class="gt ${esc(g.status)}${isSel(key)?' sel':''}" data-sel="${esc(key)}" data-game="${esc(g.key)}" style="--gc:${esc(g.color)}">
        <span class="ph"${g.thumb?` style="background-image:url('${esc(g.thumb)}')"`:''}><span class="bd">${esc(g.badge)}</span>${live?'<span class="live">🔄</span>':''}</span>
        <span class="ft"><span class="t"><b>${p!=null?Math.round(p)+'%':'—'}</b><s>${live?(g.batch&&g.batch.n?`🔄 ${g.batch.i}/${g.batch.n}`:'🔄 하는 중'):'✅ '+g.done+'/'+g.total}</s></span>${ring(p!=null?p/100:null,esc(g.color),'','mini')}</span></button>${inl('pipe',key,st)}`}).join(''):'<div class="empty">🎮 뽑기 정보 없음</div>');
    return {run:run.length,blk:cnt['막힘']||0,gl,G};
  }

  // ---------- 일정 ----------
  function planOf(st,date){
    const T=st.plan_today,W=st.plan_week;let slots=null,dflt=false;
    if(T&&T.date===date){slots=T.slots.map(s=>({...s}));dflt=!!T.default}
    else if(W&&W.days){const d=W.days.find(x=>x.date===date);if(d){slots=W.hours.map((h,i)=>({h,plan:d.plan[i]||'',actual:d.actual[i]||''}));dflt=d.default}}
    if(!slots)return null;
    for(const r of Q.of('plan_edit')){if(r.data.date!==date||r.st==='x')continue;
      if(r.st==='ok'&&Date.now()/1000-r.t>120)continue;
      const s=slots.find(x=>x.h===r.data.h);if(s){s[r.data.field]=r.data.value;s.q=r.st}}
    return {slots,dflt};
  }
  function today(st){return (st.plan_today&&st.plan_today.date)||null}
  function cntOX(slots){const c={O:0,'△':0,X:0};for(const s of slots)if(c[s.actual]!=null)c[s.actual]++;return c}
  function weekHtml(st){
    const W=st.plan_week;if(!W||!W.days)return '<div class="empty">주간 일정 없음</div>';
    let h='<div class="wk"><span></span>'+W.days.map(d=>`<span class="hd${d.date===W.today?' today':''}" data-pday="${esc(d.date)}">${esc(d.dow)}<br>${esc(d.date.slice(8))}</span>`).join('');
    W.hours.forEach((hr,i)=>{h+=`<span class="hl">${hh(hr)}</span>`+W.days.map(d=>{const p=planOf(st,d.date);const s=p?p.slots[i]:{};return `<span class="c ${s.actual||(s.plan?'p':'')}" title="${esc(s.plan||'')}"></span>`}).join('')});
    return h+'</div>';
  }
  function plan(st){
    const td=today(st);if(!planDate)planDate=td;
    document.querySelectorAll('#plan-seg [data-pv]').forEach(b=>b.classList.toggle('on',b.dataset.pv===planView));
    const pt=td&&planOf(st,td),nh=new Date().getHours(),cur=pt&&pt.slots.find(s=>s.h===nh),c=pt?cntOX(pt.slots):{O:0,'△':0,X:0};
    put('#plan-sum',pt?`${hn(esc(cur&&cur.plan||'—'),'⏱️ '+hh(nh)+'시 지금','b')}${hn(c.O,'✅ O','g')}${hn(c['△'],'🟡 △','y')}${hn(c.X,'🔴 X','r')}`:'<div class="sub">📅 일정 없음</div>');
    if(planView==='week'){put('#plan-head','');put('#plan-body',weekHtml(st));return}
    const p=planDate&&planOf(st,planDate);

    put('#plan-head',`📅 <b>${esc(planDate.slice(5))}</b>${planDate===td?' 오늘':` <button class="chip" data-pday="${esc(td)}">오늘로</button>`}${p.dflt?' · 기본 양식':''}`);
    put('#plan-body',p.slots.map(s=>`<div class="slot${planDate===td&&s.h===nh?' now':''}"><span class="hh">${hh(s.h)}</span>
      <button class="pl" data-pedit="${s.h}">${esc(s.plan)}</button>${s.q==='pend'||s.q==='sent'?'<span class="pd">⏳</span>':s.q==='fail'?'<span class="pd">⚠️</span>':''}
      <span class="oxs">${['O','△','X'].map(v=>`<button class="ox ${v}${s.actual===v?' on':''}" data-pox="${s.h}" data-v="${v}">${v}</button>`).join('')}</span></div>`).join(''));
    return cur;

  // ☀️ 오늘 카드(관제센터 05:03): 날짜는 05시 기준(PC 지킴이 plan_today.date). 묻지 않고 자동. 계획 칸은 여기서 바로 고침(plan_edit)

  function tasks(st){
    const T=st.tasks||{};const doneLocal=new Set(Q.of('task_done').filter(r=>r.st!=='fail').map(r=>r.data.key));

      +(failed.length?'<div class="li"><span class="ic r">⚠️</span><span class="t"><b>끝 표시 실패</b></span><button class="chk" data-retry="1">다시</button></div>':'')

  function bind(){
    document.addEventListener('click',e=>{

      else if(t.dataset.rs){const r=t.dataset.rs;quizReasons.has(r)?quizReasons.delete(r):quizReasons.add(r);quiz(Sync.state)}
      else if(t.dataset.qsend){const q=Sync.state.quiz_today;Q.add('quiz_answer',{key:q.date+'|'+q.motion_type,date:q.date,motion_type:q.motion_type,pick:quizSel,reasons:[...quizReasons],options:q.options.map(o=>o.id)});quiz(Sync.state);Sync.push();toast('✅ 보냈어요')}
      else if(t.dataset.retry){const l=Q.list();for(const r of l)if(r.st==='fail'&&r.kind!=='ask'){r.st='pend';if(r.rej){r.rej=false;r.id=r.id+'r'}}Q.save(l);all(Sync.state);Sync.push()}
      else if(t.dataset.pv){planView=t.dataset.pv;plan(Sync.state)}
      else if(t.dataset.pday){planDate=t.dataset.pday;planView='day';if(tab!=='plan')go('plan');plan(Sync.state)}
      else if(t.dataset.pox){const p=planOf(Sync.state,planDate);const s=p&&p.slots.find(x=>x.h===+t.dataset.pox);if(s)planSet(s.h,'actual',s.actual===t.dataset.v?'':t.dataset.v)}
      else if(t.dataset.pedit)openEdit(t.dataset.pedit);
      else if(t.dataset.tpox||t.dataset.tpedit){planDate=today(Sync.state);planView='day';   // ☀️ 오늘 카드에서 바로 고치기
        if(t.dataset.tpedit)openEdit(t.dataset.tpedit);else{const p=planOf(Sync.state,planDate);const s=p&&p.slots.find(x=>x.h===+t.dataset.tpox);if(s)planSet(s.h,'actual',s.actual===t.dataset.v?'':t.dataset.v)}}
      else if(t.dataset.eq!=null){$('#edit-val').value=t.dataset.eq;saveEdit()}

      else if(t.dataset.jold){jobOld=!jobOld;jobs(Sync.state)}

  function saveEdit(){if(editing==null)return;planSet(editing,'plan',$('#edit-val').value.trim().slice(0,40));$('#edit').hidden=true;editing=null}

  function speak(st){
    if(!('speechSynthesis' in window)){toast('읽기를 지원하지 않아요');return}

    const reds=((st.board&&st.board.projects)||[]).filter(p=>p.light==='🔴').map(p=>`${p.name} 막힘. ${p.blocked||p.now}`);
    const txt=[...reds,...items].join('. ')||'새 알림이 없어요';
    const u=new SpeechSynthesisUtterance(txt.replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu,''));u.lang='ko-KR';speechSynthesis.speak(u);
  }
  return {all,bind,go,put,pick,get tab(){return tab},get wide(){return wide()}};
})();

// 퀴즈 클립: state clip_N = {id, mime, b64} 를 볼 때만 받아 Blob 주소로 재생. 폰에 저장(같은 클립은 다시 안 받음).
const Clip={url:{},loading:{},
  async need(st){
    const q=st&&st.quiz_today;if(!q||!q.options)return;
    const want=q.options.filter(o=>o.clip_state).map(o=>({n:o.clip_state,cid:o.clip_id||o.id}));
    const keep=new Set(want.map(w=>'wc_cl_'+w.cid));
    try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.startsWith('wc_cl_')&&!keep.has(k))localStorage.removeItem(k)}}catch(e){}
    for(const w of want){
      if(this.url[w.cid]||this.loading[w.cid])continue;this.loading[w.cid]=1;
      try{
        let c=lsGet('wc_cl_'+w.cid,null);
        if(!c){const r=await api.get([w.n]);c=r.state&&r.state[w.n];
          if(c&&c.id===w.cid){try{localStorage.setItem('wc_cl_'+w.cid,JSON.stringify(c))}catch(e){}}else c=null}
        if(c){const bin=atob(c.b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
          this.url[w.cid]=URL.createObjectURL(new Blob([u8],{type:c.mime||'video/mp4'}))}
      }catch(e){}
      delete this.loading[w.cid];this.apply();
    }
  },
  apply(){document.querySelectorAll('video[data-cid]').forEach(v=>{const u=this.url[v.dataset.cid];if(u&&v.getAttribute('src')!==u){v.src=u;v.play().catch(()=>{})}})}
};

// 선생님에게 묻기(SPEC_v2 2절): 대상 고르기 → 질문 → inbox kind=ask → PC가 claude -p → answers.json 으로 답.
// 대화는 thread(같은 대상과 이어서). 보낸 뒤 ⏳ → 답 오면 말풍선 + 알림 탭 배지. 실패는 ⚠️ + 다시 보내기.
const Ask=(()=>{
  let to=lsGet('wc_ask_to','anim_teacher'),th=lsGet('wc_ask_th',{}),isOpen=false,newTh=null;
  const seen=new Set(lsGet('wc_seen',[]));
  const saveSeen=()=>lsSet('wc_seen',[...seen].slice(-400));
  const NAME=Object.fromEntries(ASK_TO.map(x=>[x[0],x[1]+' '+x[2]]));
  const newId=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

  function threads(st){ // 서버 thread + 아직 서버에 없는 내 질문 thread
    const T=((st.answers&&st.answers.threads)||[]).map(t=>({...t}));
    const have=new Set(T.map(t=>t.id));
    for(const r of Q.of('ask')){if(r.st==='x'||have.has(r.data.thread))continue;have.add(r.data.thread);
      T.push({id:r.data.thread,to:r.data.to,title:r.data.text.slice(0,40),updated:new Date(r.t*1000).toISOString().slice(0,19).replace('T',' '),msgs:[],local:true})}
    return T.sort((a,b)=>String(b.updated).localeCompare(String(a.updated)));
  }
  function unseen(st){let n=0;const list=[];
    for(const t of (st.answers&&st.answers.threads)||[])for(const m of t.msgs)if(m.st==='ok'&&!seen.has(m.id)){n++;list.push({t,m})}
    return {n,list}}
  function cur(st){ // 지금 보는 thread id
    if(th[to])return th[to];
    const t=threads(st).find(x=>x.to===to);return t?t.id:(newTh||(newTh=newId()));
  }
  function msgsHtml(st,id){
    const T=threads(st).find(x=>x.id===id);const sm=T?T.msgs:[];const ids=new Set(sm.map(m=>m.id));
    let h='';
    for(const m of sm){
      h+=`<div class="bub me">${esc(m.q)}<span class="meta">${esc((m.t||'').slice(5))}</span></div>`;
      if(m.st==='ok')h+=`<div class="bub ai">${esc(m.a)}<span class="meta">${esc((m.at||'').slice(5))}${m.req?' · 📨 '+esc(m.req):''}</span></div>`;
      else if(m.st==='fail')h+=`<div class="bub ai bad">⚠️ 답 실패: ${esc(m.err||'')}<span class="meta"><button class="chip" data-reask="${esc(m.id)}">다시 보내기</button></span></div>`;
      else h+=`<div class="bub ai wait">${m.st==='run'?'✍️ 답 쓰는 중…':'⏳ 순서 기다리는 중'}</div>`;
    }
    for(const r of Q.of('ask')){if(r.data.thread!==id||ids.has(r.id)||r.st==='x')continue;
      h+=`<div class="bub me">${esc(r.data.text)}<span class="meta">${r.st==='fail'?'⚠️ '+esc(r.msg||'못 보냄'):r.st==='pend'?'⏳ 보내는 중':r.st==='sent'?'📨 PC 전달 기다리는 중':'✅ PC가 받음'}</span></div>`;
      h+=r.st==='fail'?`<div class="bub ai bad">⚠️ 보내지 못함<span class="meta"><button class="chip" data-reask="${esc(r.id)}">다시 보내기</button></span></div>`:`<div class="bub ai wait">⏳ 답 기다리는 중</div>`;
    }
    return h||`<div class="empty">💬 ${esc(NAME[to])}에게 질문</div>`;
  }
  function render(st){
    const u=unseen(st);
    $('#ask-badge').textContent=u.n||'';
    UI.put('#noti-ans',u.list.slice(0,8).map(({t,m})=>`<div class="li ansrow" data-goask="${esc(t.id)}" data-to="${esc(t.to)}"><span class="ic p">${esc((NAME[t.to]||'').split(' ')[0])}</span><span class="t"><b>${esc(t.title)}</b><s>${esc(String(m.a).slice(0,90))}</s></span><span class="v">›</span></div>`).join(''));
    $('#noti-ans-card').hidden=!u.n;
    if(isOpen){
      const id=cur(st);
      // 보고 있는 thread의 답은 먼저 읽음 처리(목록의 ● 표시가 남지 않게)
      const T0=threads(st).find(x=>x.id===id);
      if(T0&&!document.hidden){let c=false;for(const m of T0.msgs)if(m.st==='ok'&&!seen.has(m.id)){seen.add(m.id);c=true}if(c)saveSeen()}
      UI.put('#ask-to',ASK_TO.map(([k,e,n])=>`<button class="chip${k===to?' on':''}" data-askto="${k}">${e} ${n}</button>`).join(''));
      const ts=threads(st).filter(x=>x.to===to).slice(0,12);
      UI.put('#ask-ths',`<button data-newth="1" class="${ts.some(x=>x.id===id)?'':'on'}">＋ 새로</button>`+ts.map(t=>{const nb=t.msgs.some(m=>m.st==='ok'&&!seen.has(m.id));return `<button data-th="${esc(t.id)}" class="${t.id===id?'on':''}">${nb?'<span class="nb">● </span>':''}${esc(t.title)}</button>`}).join(''));
      if(UI.put('#ask-msgs',msgsHtml(st,id))){const el=$('#ask-msgs');el.scrollTop=el.scrollHeight}
      const A=st.answers||{};$('#ask-run').textContent=(A.running||A.queued)?`✍️ ${A.running||0}${A.queued?' · 대기 '+A.queued:''}`:'';
      // 보고 있는 thread의 답은 읽음
      const T=threads(st).find(x=>x.id===id);let ch=false;
      if(T&&!document.hidden)for(const m of T.msgs)if(m.st==='ok'&&!seen.has(m.id)){seen.add(m.id);ch=true}
      if(ch){saveSeen();$('#ask-badge').textContent=unseen(st).n||''}
    }
    return {unseen:u.n};
  }
  function open(t,id){
    if(t){to=t;lsSet('wc_ask_to',to)}
    if(id){th[to]=id;lsSet('wc_ask_th',th)}
    isOpen=true;$('#ask').hidden=false;UI.all(Sync.state);Sync.push();
  }
  function close(){isOpen=false;$('#ask').hidden=true;UI.all(Sync.state)}
  function send(text){
    text=(text||'').trim();if(!text)return;
    const id=cur(Sync.state);th[to]=id;lsSet('wc_ask_th',th);newTh=null;
    Q.add('ask',{to,thread:id,text:text.slice(0,2000)});
    UI.all(Sync.state);Sync.push();
  }
  function click(t){
    if(t.id==='ask-open')open();
    else if(t.id==='ask-close')close();
    else if(t.id==='ask-send'){const a=$('#ask-text');send(a.value);a.value=''}
    else if(t.dataset.askto){to=t.dataset.askto;lsSet('wc_ask_to',to);UI.all(Sync.state)}
    else if(t.dataset.newth){newTh=newId();th[to]=newTh;lsSet('wc_ask_th',th);UI.all(Sync.state);$('#ask-text').focus()}
    else if(t.dataset.th){th[to]=t.dataset.th;lsSet('wc_ask_th',th);UI.all(Sync.state)}
    else if(t.dataset.reask){
      const l=Q.list();const r=l.find(x=>x.id===t.dataset.reask);let text='';
      if(r){text=r.data.text;r.st='x';Q.save(l)}
      else for(const T of (Sync.state.answers&&Sync.state.answers.threads)||[])for(const m of T.msgs)if(m.id===t.dataset.reask)text=m.q;
      send(text);toast('다시 보냈어요');
    }
  }
  function bind(){
    document.addEventListener('click',e=>{const r=e.target.closest('[data-goask]');if(r)open(r.dataset.to,r.dataset.goask)});
    $('#ask-text').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();click($('#ask-send'))}});
  }
  // 답을 기다리는 중이면 동기화를 빠르게
  function waiting(){
    if(Q.of('ask').some(r=>r.st==='pend'||r.st==='sent'))return true;
    const A=Sync.state.answers;if(A&&(A.running||A.queued))return true;
    const done=new Set();for(const T of (A&&A.threads)||[])for(const m of T.msgs)if(m.st==='ok'||m.st==='fail')done.add(m.id);
    return Q.of('ask').some(r=>r.st==='ok'&&!done.has(r.id)&&Date.now()/1000-r.t<900);
  }
  return {render,click,bind,open,close,waiting,get isOpen(){return isOpen}};
})();

// 동기화: 저장본 즉시 표시 → 큐 보내기 → 상태 받기. 켤 때·돌아올 때·1분마다(묻기 답 기다리는 중엔 8초마다).
const Sync={state:lsGet('wc_state',{}),err:'',busy:false,t:0,
  async run(){
    if(this.busy)return;this.busy=true;this.t=Date.now();
    try{
      await Q.flush();
      const res=await api.get(STATE_NAMES);
      if(!res.ok)throw new Error(res.msg||'상태 못 받음');
      this.state=Object.assign({},this.state,res.state);lsSet('wc_state',this.state);
      Q.applyDone(this.state.meta&&this.state.meta.done);this.err='';
    }catch(e){this.err=e.message}
    this.busy=false;UI.all(this.state);
  },
  push(){clearTimeout(this._p);this._p=setTimeout(()=>this.run(),300)}
};

// 새 버전 확인: 손 뗀 화면(입력 중 아님·퀴즈 고르는 중 아님·묻기/고치기 창 닫힘)에서만 새로고침
async function checkBuild(){
  try{const r=await fetch('version.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const v=await r.json();
    if(v.build>BUILD){const busy=document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)||document.querySelector('.opt.on')||Ask.isOpen||!$('#edit').hidden;
      // 같은 새 번호로 2분 안에 다시 새로고침하지 않는다(Pages 캐시로 옛 index가 올 때 무한 새로고침 방지)
      const last=lsGet('wc_reload',{});if(last.b===v.build&&Date.now()-last.t<120000)return;
      if(!busy){lsSet('wc_reload',{b:v.build,t:Date.now()});location.reload()}else setTimeout(checkBuild,30000)}}catch(e){}
}

UI.bind();Ask.bind();UI.all(Sync.state);Sync.run();checkBuild();
// 스크롤하면 큰 제목 대신 작은 제목이 위에 붙음(One UI)
const onScroll=()=>{const h=document.querySelector('.pane.on .hero');document.body.classList.toggle('scrolled',!!h&&scrollY>h.offsetHeight-70)};
addEventListener('scroll',onScroll,{passive:true});onScroll();
// 좁은 화면 ↔ 넓은 화면(폴드 접기·펴기)이 바뀔 때만 다시 그림(키보드로 높이만 바뀔 때는 그대로)
let wasWide=UI.wide;addEventListener('resize',()=>{if(UI.wide!==wasWide){wasWide=UI.wide;UI.all(Sync.state)}});
setInterval(()=>{if(document.hidden)return;const gap=Ask.waiting()?SYNC_FAST_MS:SYNC_MS;if(Date.now()-Sync.t>=gap)Sync.run()},4000);
setInterval(checkBuild,BUILD_CHECK_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){Sync.run();checkBuild()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
